# Configuración de la prueba de factibilidad de onda.
# Todo lo que es "opinable" (prompts, umbrales, listas de tags) vive acá
# para que el equipo lo pueda discutir y cambiar sin tocar código.

[run]
candidates_per_prompt = 30
# Mercado para resolver en Spotify (solo se usa si hay credenciales).
spotify_market = "AR"

# --- Prompts de prueba -------------------------------------------------------
# genres / years: lo que un humano espera de cada escena, para medir relevancia
# (comando `relevance`). Se escribieron ANTES de ajustar el ranking y no se tocan
# para que den mejor: si están mal, se corrigen discutiéndolo en el equipo.
# Los 5 del documento + 1 de estrés para música argentina/latina reciente.
[[prompts]]
id = "preboliche"
text = "Preboliche con amigos: reguetón divertido y conocido para cantar todos"
genres = ["reggaeton", "latin", "latin pop", "latin urban", "urbano latino", "dembow", "latin trap", "moombahton"]

[[prompts]]
id = "lluvia"
text = "Domingo de lluvia, tranqui, mirando por la ventana"
genres = ["indie folk", "folk", "singer songwriter", "acoustic", "jazz", "soul", "bossa nova", "dream pop", "ambient", "lo fi", "chamber pop", "slowcore"]

[[prompts]]
id = "estudio"
text = "Música para estudiar concentrada para un parcial, que no me distraiga"
genres = ["ambient", "classical", "neoclassical", "modern classical", "contemporary classical", "piano", "instrumental", "lo fi", "chillhop", "post rock", "downtempo", "idm", "soundtrack"]

[[prompts]]
id = "entrenamiento"
text = "Entrenamiento de fuerza en el gimnasio, algo que me dé mucha energía"
genres = ["metal", "nu metal", "metalcore", "hard rock", "hip hop", "rap", "trap", "electronic", "edm", "dubstep", "drum and bass", "hardstyle", "industrial", "punk"]

[[prompts]]
id = "nostalgia"
text = "Nostalgia de la secundaria: temas que escuchábamos en los 2000"
years = [2000, 2009]   # acá lo que importa es la época

[[prompts]]
id = "previa_local"
text = "Previa en Buenos Aires con cumbia, cuarteto y RKT"
genres = ["cumbia", "cuarteto", "rkt", "turreo", "cumbia villera", "cumbia argentina", "cumbia santafesina", "cumbia pop"]

# --- Matching (artista, título) contra cada fuente ---------------------------
[matching]
title_min_similarity = 0.85
artist_min_similarity = 0.85
musicbrainz_search_limit = 25

# --- Umbrales de "vale la pena" ---------------------------------------------
# Fracción de candidatos (0-1). Son una propuesta: discútanlos antes de correr,
# no después de ver los resultados.
[thresholds]
exists_in_musicbrainz = 0.80     # la canción existe (no es alucinación)
resolved_in_spotify = 0.70       # se puede exportar
has_3_useful_tags = 0.50         # hay señal textual para mood/escena
recognizable = 0.60              # "música reconocible" (ver [popularity])

[popularity]
# Una canción cuenta como "reconocible" si supera cualquiera de estos cortes.
lastfm_min_listeners = 50000
listenbrainz_min_users = 100
# Corte más exigente, solo informativo.
lastfm_hit_listeners = 500000

[tags]
min_count_lastfm = 5             # Last.fm normaliza counts a 0-100
# Tags que no describen la canción.
junk = [
  "seen live", "favorite", "favorites", "favourite", "favourites",
  "my favorite", "favorite songs", "favourite songs", "albums i own",
  "love", "loved", "awesome", "amazing", "beautiful", "best", "good",
  "cool", "great", "spotify", "youtube", "check out", "<3", "fav", "favs",
  "under 2000 listeners", "all", "music", "song", "songs", "tracks",
]
# Vocabulario de mood/escena/actividad (es + en). El tag tiene que SER la
# entrada (sacando relleno como 'music' o 'day'), no contenerla: así
# 'soft rock' o 'indie dance' no cuentan. Con '*' al final es una raíz de
# una palabra ('nostalg*' -> 'nostalgic'). Sin tildes da igual.
# Quedan afuera a propósito palabras que en los tags son géneros:
# 'dance', 'ambient', 'soft'.
mood_lexicon = [
  "party", "fiesta", "danceable", "dancing", "bailable", "bailar",
  "upbeat", "happy", "feel good", "feelgood", "fun", "energetic", "energy",
  "workout", "gym", "running", "training", "motivation*", "pump up", "hype",
  "aggressive", "angry", "anthemic", "chill", "chillout", "chill out", "relax*", "calm", "mellow",
  "study*", "focus", "concentra*", "rain", "rainy", "lluvia", "sad",
  "melanchol*", "nostalg*", "romantic*", "love songs", "sensual", "sexy",
  "perreo", "summer", "verano", "night", "noche", "emotional", "dreamy",
  "atmospheric", "uplifting", "epic", "peaceful", "sleep", "morning",
  "sing along", "singalong", "catchy", "previa", "joda", "tranqui", "dark",
]

# --- build: el enfoque de onda. ----------------------------------------------
# El LLM interpreta la escena (moods, géneros, artistas); las canciones salen
# de Last.fm y se rankean. Ver onda_poc/scene.py.
[build]
embed_model = "embeddinggemma"   # modelo de embeddings (Ollama); LLM_EMBED_MODEL lo pisa
tag_limit = 50                   # canciones por tag (tag.getTopTracks)
artist_limit = 10                # canciones por artista de referencia
similar_artists = 3              # artistas similares por cada artista de referencia
similar_limit = 5                # canciones por artista similar
enrich = 120                     # cuántas del pool se enriquecen con tags (1 request c/u + 1 por artista nuevo, la primera vez)
max_per_artist = 2               # diversidad en la playlist final

[build.weights]                  # puntaje = promedio ponderado; ajustar SOLO mirando --dev
semantic = 0.30                  # similitud de embeddings escena vs. tags de la canción y del artista
tags = 0.15                      # moods pedidos que la canción tiene
genre = 0.20                     # tiene algún género pedido (canción o artista)
era = 0.10                       # tiene el tag de la época pedida (solo si se pidió)
sources = 0.15                   # en cuántas búsquedas apareció
popularity = 0.10                # oyentes en Last.fm (escala log)
genre_penalty = 0.25             # x puntaje si no tiene ningún género pedido
era_penalty = 0.30               # x puntaje si se pidió época y no la tiene
artist_fit = 0.15                # parecido del artista a los artistas de referencia (perfil de tags)
fit_min = 0.25                   # afinidad por debajo de esto…
fit_penalty = 0.50               # …multiplica el puntaje por esto

# --- Escenas de desarrollo -----------------------------------------------------
# Para ajustar el ranking (pesos, filtros). Son distintas de [[prompts]], que
# quedan solo para evaluar: si ajustamos mirando esas, los números dejan de valer.
[[dev_prompts]]
id = "asado"
text = "Asado con amigos un sábado al mediodía, rock nacional"
genres = ["rock nacional", "rock argentino", "argentine rock", "rock en espanol", "rock"]

[[dev_prompts]]
id = "ruta_noche"
text = "Manejando de noche por la ruta, algo electrónico y tranquilo"
genres = ["electronic", "synthwave", "downtempo", "ambient", "chillwave", "electronica", "deep house", "trip hop"]

[[dev_prompts]]
id = "cena"
text = "Cena romántica en casa, jazz o bossa nova"
genres = ["jazz", "bossa nova", "vocal jazz", "smooth jazz", "mpb", "soul"]

[[dev_prompts]]
id = "limpieza"
text = "Limpiando la casa un domingo con pop de los 80"
genres = ["pop", "synthpop", "new wave", "80s", "dance pop", "pop rock"]
years = [1980, 1989]

[[dev_prompts]]
id = "quince"
text = "Fiesta de 15 con cumbia y reggaetón"
genres = ["cumbia", "reggaeton", "cumbia villera", "cumbia pop", "rkt", "latin", "dembow"]

[[dev_prompts]]
id = "lectura"
text = "Leyendo un libro de noche, música clásica suave"
genres = ["classical", "piano", "baroque", "romantic", "modern classical", "neoclassical", "chamber music"]

[[dev_prompts]]
id = "auto_vives"
text = "Estoy en el auto volviendo del trabajo y quiero escuchar algo divertido y cantable tipo Carlos Vives"
# Sin "tropical" ni "latin": en Last.fm "tropical" suele ser tropical house y "latin" incluye casi todo.
genres = ["vallenato", "cumbia", "salsa", "merengue", "latin pop", "pop latino", "bachata", "colombian", "champeta", "rock en espanol", "latin rock", "son cubano"]
